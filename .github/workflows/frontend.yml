name: Build and Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'deploy/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-frontend
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REACT_APP_BACKEND_URL=${{ github.ref == 'refs/heads/main' && 'https://backend.immersio.dikotech.com' || 'https://dev-backend.immersio.dikotech.com' }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-frontend
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ansible
        uses: qzbible/config-server/.github/actions/setup-ansible@v2.0.0
        with:
          ssh_private_key: ${{ secrets.OVH_MANAGER_SSH_PRIVATE_KEY }}
          ansible_vault_pass: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          working_directory: deploy

      - name: Run Ansible
        working-directory: deploy
        run: |
          ENV_NAME=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          ansible-playbook -e env=$ENV_NAME -e image=${{ needs.build-frontend.outputs.image-tag }} --tags frontend deploy.yml
