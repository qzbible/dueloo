name: Build and Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'docker/develop/flask/**'
      - '.github/workflows/backend.yml'
      - 'deploy/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-backend
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          file: docker/develop/flask/Dockerfile
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-backend
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ansible
        uses: qzbible/config-server/.github/actions/setup-ansible@v2.0.0
        with:
          ssh_private_key: ${{ secrets.OVH_MANAGER_SSH_PRIVATE_KEY }}
          ansible_vault_pass: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          working_directory: deploy

      - name: Run Ansible
        working-directory: deploy
        run: |
          # Determine environment based on branch
          ENV_NAME=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          ansible-playbook -e env=$ENV_NAME -e image=${{ needs.build-backend.outputs.image-tag }} --tags backend deploy.yml
